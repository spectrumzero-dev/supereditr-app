[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
authors = ["Sandeep Ghael"]

[workspace.dependencies]
supereditr-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "charset"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"

# Line tables keep file and line numbers in backtraces, link faster than full debug info and make
# target/ much smaller. To inspect variables in a debugger, build once with
# CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

# Harper builds its proofreading dictionary at runtime. Optimizing this dependency speeds up
# repeated tests, while workspace crates still compile with the usual dev settings.
[profile.dev.package.harper-core]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
