[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Sandeep Ghael"]

[workspace.dependencies]
supereditr-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2", "charset"] }
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
