  <path transform="translate(11 30) rotate(35)" fill="#000000" fill-rule="evenodd"
        d="M0 0 L-7 -13 Q-9 -16.5 -6.5 -20 L-5 -26 H5 L6.5 -20 Q9 -16.5 7 -13 Z
           M-0.9 -2 V-13.3 H0.9 V-2 Z
           M2.2 -15.5 A2.2 2.2 0 1 0 -2.2 -15.5 A2.2 2.2 0 1 0 2.2 -15.5 Z"/>
</svg>
