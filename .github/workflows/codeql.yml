name: CodeQL

# Scans the source for security problems and uploads the results to the repository's code scanning
# alerts. Every language is analyzed from source without building it, so the job runs on a
# GitHub-hosted Linux runner. Rust is left out: its scan took about ten minutes, analyzed the
# macOS-only code only partly on Linux, and raised no real alerts.
# Changes to only documentation or images skip it; the weekly run still scans everything.

on:
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "**.png", "**.svg", ".gitignore"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", "**.png", "**.svg", ".gitignore"]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.repository == 'spectrumzero-dev/supereditr-app'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
