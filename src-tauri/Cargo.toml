[package]
name = "supereditr"
description = "SuperEditr: instant, keyboard-first proofreading for any text field."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "supereditr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
supereditr-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
plist = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
tauri-plugin-updater = "2.14"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1.1"
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["elcapitan"] }
# The raw event pointer, for Core Graphics calls the core-graphics crate doesn't wrap.
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray", "NSURL", "NSGeometry", "NSNotification", "NSDictionary", "NSOperation", "NSBundle", "NSFileManager", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSEvent", "NSResponder", "NSApplication", "NSWindow", "NSGraphics", "NSWorkspace", "NSScreen", "NSOpenPanel", "NSImage", "NSBitmapImageRep", "NSGraphicsContext", "objc2-uniform-type-identifiers", "block2"] }
# The Privacy page's app picker shows only apps.
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType", "UTCoreTypes"] }
block2 = "0.6"
# Drags SuperEditr.app out of the permission guide into System Settings.
drag = "2.1.1"
