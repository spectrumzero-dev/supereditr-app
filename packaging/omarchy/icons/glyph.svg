<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="2.25 4.5 28 28">
  <!-- The tray glyph (ui/assets/tray.svg), its slit and breather hole cut by even-odd fill instead of a
       mask, which Qt's SVG renderer may not draw, and its view box cropped to the glyph so it fills the
       bar's icon size. The widget paints the bar's color through its alpha. -->
